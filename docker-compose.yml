# Nombre del proyecto Compose. Se fija explicitamente porque la carpeta se
# renombro y el proyecto paso a llamarse Farmar: sin esto, Compose derivaria el
# nombre de la carpeta actual, crearia volumenes nuevos VACIOS y se perderian
# de vista los datos ya cargados (catalogo de productos y workflows de n8n).
name: farmar-bot-whatsapp

services:
  postgres:
    image: postgres:16-alpine
    container_name: farmar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Puerto expuesto al host para poder conectarse desde el nodo Postgres
      # de n8n usando "localhost" (o desde un cliente SQL tipo DBeaver/pgAdmin).
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Volumen persistente: los datos sobreviven a "docker compose down".
      - postgres_data:/var/lib/postgresql/data
      # Se ejecuta UNA sola vez, al crear el contenedor por primera vez con
      # el volumen vacío. Si ya corriste esto antes y querés que se re-ejecute,
      # tenés que borrar el volumen (ver README.md).
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: farmar_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Zona horaria para que los timestamps de ejecuciones/cron coincidan
      # con la hora local de Argentina.
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
      TZ: ${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}

      # Autenticación básica de la interfaz web de n8n.
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      # URL pública usada para construir las URLs de los nodos Webhook.
      # Tiene que apuntar a la URL HTTPS de ngrok/Cloudflare Tunnel una vez
      # que lo levantes (ver README.md), no a localhost.
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL}
    volumes:
      # Volumen persistente para la base de datos interna de n8n (SQLite),
      # credenciales cifradas, workflows guardados, etc.
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Tunel HTTPS hacia n8n, necesario porque WhatsApp Cloud API exige un webhook
  # publico con certificado valido y no acepta localhost.
  #
  # Se corre como contenedor en vez de instalarlo en Windows: no requiere
  # permisos de administrador y se levanta junto con el resto.
  #
  # Requiere NGROK_AUTHTOKEN en el .env (cuenta gratis en ngrok.com).
  # Es un perfil aparte: solo arranca si se lo pide explicitamente, para no
  # exponer n8n a internet en cada "docker compose up".
  #
  #   Levantar:  docker compose --profile tunel up -d
  #   Ver la URL publica:  http://localhost:4040
  #   Apagar:    docker compose --profile tunel down
  # ---------------------------------------------------------------------------
  ngrok:
    image: ngrok/ngrok:latest
    container_name: farmar_ngrok
    restart: unless-stopped
    profiles: ["tunel"]
    command: http n8n:5678
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      # Panel local de ngrok: muestra la URL publica y el trafico entrante.
      - "4040:4040"
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
